server {
    listen 80;
    server_name 223.6.255.187;
    location /.well-known/acme-challenge/ { root /var/www/egg-acme; }
    location / { return 301 https://223.6.255.187$request_uri; }
}
server {
    listen 443 ssl;
    server_name 223.6.255.187;
    ssl_certificate /etc/letsencrypt/live/egg-cloud-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/egg-cloud-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 5m;
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }
    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host $host;
    }
}
